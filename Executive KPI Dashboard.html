<title>Executive KPI Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF1F4;--card:#fff;--ink:#13233B;--mute:#5B6B80;--line:#D9E0E8;--a:#0F766E;--b:#D68A0B;--c:#3B5B9D;--bad:#B42318;--good:#12805C;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1622;--card:#16212F;--ink:#E7EDF5;--mute:#93A3B8;--line:#27364A;--a:#2DD4BF;--b:#F5B544;--c:#7FA2E8;--bad:#F97066;--good:#4ADE9A}}
:root[data-theme="dark"]{--bg:#0E1622;--card:#16212F;--ink:#E7EDF5;--mute:#93A3B8;--line:#27364A;--a:#2DD4BF;--b:#F5B544;--c:#7FA2E8;--bad:#F97066;--good:#4ADE9A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 28px}
h1{font-size:22px;font-weight:600;margin:0 0 2px}.sub{color:var(--mute);margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.bar label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:130px}
select:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--a);border-radius:6px;padding:10px 12px}
.k.sel{border-left-color:var(--b)}.k small{color:var(--mute);display:block}.k b{font-size:22px;font-weight:600}.k span{font-size:12px;display:block}
.up{color:var(--good)}.dn{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;grid-column:span 4;min-width:0}
.p.w{grid-column:span 8}.p.f{grid-column:span 12}
.p h2{font-size:13px;font-weight:600;margin:0 0 8px}.cv{position:relative;height:250px}
@media(max-width:860px){.p,.p.w{grid-column:span 12}}
